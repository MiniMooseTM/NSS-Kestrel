- type: entity
  parent: BaseWallmountMetallic
  id: BaseSign
  name: base sign
  abstract: true
  components:
  - type: WallMount
    arc: 180 # Kestrel: was 360. One-sided, like APCs: only visible from the side it faces.
  - type: KestrelWallMountAutoFace # Kestrel: turns signs that face into a wall toward open floor
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: Structures/Wallmounts/signs.rsi
    snapCardinals: false
    noRot: true
  - type: StaticPrice
    price: 20
  - type: Transform
    anchored: false
