# Kestrel: Aurorastation's spline floor trims, fancy (thin with corner studs) and plain (solid band).
# Spline... = greyscale, tint it any colour in the decal placer.
# SplineWood... = already tinted with Aurora's wood colour (#CB9E04).
# Names say where the trim sits on the tile: LineS = bottom edge, LineSe = bottom and right,
# CornerNe = small inner-corner piece in the top right, CeeOpenN = three sides, open at the top.

- type: decal
  id: SplineFancyLineS
  tags: ["station", "markings"]
  defaultCustomColor: true # greyscale art: pick a colour when placing
  sprite:
    sprite: _Kestrel/Decals/splines.rsi
    state: fancy_line_s

- type: decal
  id: SplineWoodFancyLineS
  tags: ["station", "markings"]
  sprite:
    sprite: _Kestrel/Decals/splines.rsi
    state: wood_fancy_line_s

