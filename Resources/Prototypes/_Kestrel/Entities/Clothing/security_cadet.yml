# Kestrel: security cadet uniforms. Cadets used to wear the generic red color jumpsuit (shared with
# other jobs), so these are cadet-only copies that inherit everything from it and swap in security
# colors: midnight blue by default, navy as the loadout alternate.

- type: entity
  parent: ClothingUniformJumpsuitColorRed
  id: ClothingUniformJumpsuitSecurityCadet
  name: security cadet jumpsuit
  description: A plain midnight jumpsuit issued to security cadets. No rank markings yet.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/color/color.rsi
    layers:
    - state: icon
      color: "#243960"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#243960"
      right:
      - state: inhand-right
        color: "#243960"
  - type: Clothing
    sprite: _Kestrel/Clothing/Uniforms/Jumpsuit/security_cadet.rsi

- type: entity
  parent: ClothingUniformJumpskirtColorRed
