- type: entity
  parent: ClothingUniformJumpsuitMilitaryColorRed
  id: ClothingUniformJumpsuitMilitarySecurityCadet
  name: security cadet jumpsuit
  description: A military-cut jumpsuit with midnight blue trim, issued to security cadets.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Uniforms/Jumpsuit/military.rsi
    layers:
    - state: icon-base-bottom
      color: "#3e3e48"
    - state: icon-base-top-jumpsuit
      color: "#3e3e48"
    - state: icon-decor-contractor
      color: "#243960"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base-bottom
        color: "#3e3e48"
      - state: inhand-left-base-top-jumpsuit
        color: "#3e3e48"
      - state: inhand-left-decor-contractor
        color: "#243960"
      right:
      - state: inhand-right-base-bottom
        color: "#3e3e48"
      - state: inhand-right-base-top-jumpsuit
        color: "#3e3e48"
      - state: inhand-right-decor-contractor
        color: "#243960"
  - type: Clothing
    sprite: _NF/Clothing/Uniforms/Jumpsuit/military.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-base-bottom
        color: "#3e3e48"
      - state: equipped-base-top-jumpsuit
        color: "#3e3e48"
      - state: equipped-decor-contractor
        color: "#243960"
