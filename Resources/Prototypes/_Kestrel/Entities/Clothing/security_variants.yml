# Kestrel: alternate-color loadout variants of security clothing (navy for all core items, plus a black security cap).
# Security's default color is midnight blue; each variant inherits everything from the normal item
# and only swaps the sprite (and the in-hand tint).

- type: entity
  parent: ClothingUniformJumpsuitSec
  id: ClothingUniformJumpsuitSecNavy
  name: navy security jumpsuit
  components:
  - type: Sprite
    sprite: _Kestrel/Clothing/SecurityNavy/Uniforms/Jumpsuit/Security/security.rsi
  - type: Clothing
    sprite: _Kestrel/Clothing/SecurityNavy/Uniforms/Jumpsuit/Security/security.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/color/color.rsi
        color: "#2A4170"
      - state: overlay-inhand-left
        sprite: _Kestrel/Clothing/SecurityNavy/Uniforms/Jumpsuit/Security/security.rsi
      right:
      - state: inhand-right
        sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/color/color.rsi
        color: "#2A4170"
      - state: overlay-inhand-right
        sprite: _Kestrel/Clothing/SecurityNavy/Uniforms/Jumpsuit/Security/security.rsi

