# Kestrel: jugs for the hot drinks machine. Same pattern as DrinkCoffeeJug / DrinkTeaJug
# (Entities/Objects/Consumable/Drinks/drinks_bottles_plastic.yml): 300u, labelled, and tagged
# DrinkBottle (via DrinkBottlePlasticBaseFull) so they fit in drink dispensers.

- type: entity
  parent: [DrinkVisualsOpenable, DrinkBottlePlasticBaseFull]
  id: DrinkEspressoJug
  name: espresso jug
  description: Concentrated wake-up juice.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 300
        reagents:
        - ReagentId: Espresso
          Quantity: 300
  - type: Label
    currentLabel: reagent-name-espresso

