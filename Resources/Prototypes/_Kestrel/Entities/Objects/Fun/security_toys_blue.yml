# Kestrel: blue (Midnight) versions of the security figurines and lizard plushies, to match
# Kestrel's blue security. The red originals are unchanged and still spawn as normal.
#
# Each one uses its red original as the parent and only swaps the sprite, so it keeps the same
# name, description, voice lines, sounds and price. The "Blue" suffix only shows in the spawn
# menu, to tell them apart. Nothing spawns these yet; add them to loadouts or spawners as wanted.

# Figurines
# The blue RSI only has the figure pictures, so the in-hand sprite is pointed back at the
# original figurines.rsi (its generic in-hand pictures are the same for every figurine).

- type: entity
  parent: ToyFigurineHeadOfSecurity
  id: KestrelToyFigurineHeadOfSecurityBlue
  suffix: Blue
  components:
  - type: Sprite
    sprite: _Kestrel/Objects/Fun/figurines_blue.rsi
  - type: Item
    sprite: Objects/Fun/figurines.rsi

- type: entity
  parent: ToyFigurineWarden
  id: KestrelToyFigurineWardenBlue
