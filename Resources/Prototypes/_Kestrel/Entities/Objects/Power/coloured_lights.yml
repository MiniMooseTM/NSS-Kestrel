# Floor (accent) versions: about half strength and a much shorter reach.

- type: entity
  parent: LightTube
  id: KestrelFloorLightTubeWhite
  name: white floor light tube
  components:
  - type: LightBulb
    color: "#FFE4CE"
    lightRadius: 4 # ceiling tubes: 10
    lightEnergy: 0.5 # ceiling tubes: 0.8

