# Kestrel: coloured light tubes and bulbs. A powered light takes its colour, brightness and reach from
# the tube or bulb in it.
#
# Two sets:
#  - KestrelLightTube* / KestrelLightBulb*: full strength, same as the plain LightTube / LightBulb.
#    For normal ceiling and wall lights.
#  - KestrelFloorLightTube* / KestrelFloorLightBulb*: dim, short-reaching "accent" versions used by
#    the in-floor lights, so they mark paths and edges without lighting the whole room.
# "White" matches the plain tube/bulb colour so it blends in with the station's other lights.

- type: entity
  parent: LightTube
  id: KestrelLightTubeWhite
  name: white light tube
  components:
  - type: LightBulb
    color: "#FFE4CE"

- type: entity
  parent: LightTube
  id: KestrelLightTubeBlue
  name: blue light tube
  components:
