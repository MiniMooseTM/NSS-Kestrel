#
# Kestrel platforms. Sprites: Resources/Textures/_Kestrel/Structures/platforms.rsi
# (Aurora.3, CC-BY-SA-3.0 - see that folder's meta.json).
#
# Aurora's sprites draw the edge on the NORTH side of the tile in their south-facing
# frame, the opposite of RMC's. So these use their own bases with the hitbox on the
# north side instead of parenting CMPlatform directly.

# ---------------------------------------------------------------- bases

- type: entity
  abstract: true
  parent: CMPlatformBaseDestructible   # climbable, damageable, breakable (from _RMC14)
  id: KestrelPlatformBase
  name: platform
  description: A raised section of deck plating. You could probably climb it.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: _Kestrel/Structures/platforms.rsi
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,0.36,0.49,0.49"   # thin strip along the north edge
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer

# Corner caps and decorations: purely visual, no collision.
- type: entity
  abstract: true
  parent: CMPlatformBase
  id: KestrelPlatformDecoBase
  name: platform corner
  description: The corner of a raised section of deck plating.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: _Kestrel/Structures/platforms.rsi
  - type: Climbable
    delay: 0.25

