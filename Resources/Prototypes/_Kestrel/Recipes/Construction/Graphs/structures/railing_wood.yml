# Kestrel: wooden railing, built from planks and pried apart with a crowbar.

- type: constructionGraph
  id: RailingWood
  start: start
  graph:
    - node: start
      edges:
        - to: railing
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 1
              doAfter: 2
        - to: railingCorner
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 2.5
        - to: railingCornerSmall
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 1
              doAfter: 2
        - to: railingRound
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 2

    - node: railing
      entity: RailingWood
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Prying
              doAfter: 0.5

    - node: railingCorner
      entity: RailingWoodCorner
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:DeleteEntity
          steps:
            - tool: Prying
              doAfter: 0.75

    - node: railingCornerSmall
      entity: RailingWoodCornerSmall
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Prying
              doAfter: 0.5

    - node: railingRound
      entity: RailingWoodRound
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:DeleteEntity
          steps:
            - tool: Prying
              doAfter: 0.75
